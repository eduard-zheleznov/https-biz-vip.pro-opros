services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: survey_builder
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey_builder"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://survey:survey@db:5432/survey_builder?schema=public
      SESSION_COOKIE_NAME: survey_builder_session
      SESSION_TTL_DAYS: "14"
      SESSION_SECRET: 3af446c880089da5ee8a12e512c778325e33d6e2bc2eeb98812eb6a92240c70d
      APP_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      DEFAULT_ADMIN_EMAIL: info@biz-vip.ru
      DEFAULT_ADMIN_PASSWORD: "12345678"
      DEFAULT_MEMBER_PASSWORD: "123456"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      TELEGRAM_BOT_TOKEN: ""
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:worker
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://survey:survey@db:5432/survey_builder?schema=public
      SESSION_COOKIE_NAME: survey_builder_session
      SESSION_TTL_DAYS: "14"
      SESSION_SECRET: 3af446c880089da5ee8a12e512c778325e33d6e2bc2eeb98812eb6a92240c70d
      APP_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      DEFAULT_ADMIN_EMAIL: info@biz-vip.ru
      DEFAULT_ADMIN_PASSWORD: "12345678"
      DEFAULT_MEMBER_PASSWORD: "123456"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      TELEGRAM_BOT_TOKEN: ""
    volumes:
      - .:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  uploads-data:
